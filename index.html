<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
  /* Layout: one quiet column; a thin clock rail on top during the simulation; lines arrive one at a time */
  :root {
    --bg: #f2f3f5;
    --fg: #22252c;
    --muted: #6a7080;
    --line: #d4d7de;
    --accent: #4a5c79;
    --accent-fg: #f6f7f9;
    --urgent: #9a4a3c;

    --body: "IBM Plex Sans Thai Looped", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  /* CJK and Arabic need their own faces; every other language keeps the original fonts */
  :lang(zh) { --display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }

  :lang(ar) { --display: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif; --body: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif; }

      --bg: #14161b; --fg: #e3e5ea; --muted: #949aa9; --line: #2b2f38;
      --accent: #a8b7d1; --accent-fg: #14161b; --urgent: #e09a8a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b; --fg: #e3e5ea; --muted: #949aa9; --line: #2b2f38;
    --accent: #a8b7d1; --accent-fg: #14161b; --urgent: #e09a8a; color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);

    padding-inline: 20px;
  }
  button, select { font: inherit; }
  .close {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; z-index: 3;
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: transparent; color: var(--fg); cursor: pointer; display: grid; place-items: center;
  }
  .close:hover { background: var(--line); }
  .lang {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 64px; z-index: 3;
    height: 44px; max-width: 9.5rem; padding: 0 .6rem; border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg); color: var(--fg); font-size: .85rem; font-weight: 400; cursor: pointer;
  }
  .lang:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* clock rail */
  .rail {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 190px 12px 20px;
    background: var(--bg);
    display: flex; align-items: center; gap: 14px;
  }
  .clock { font-family: var(--mono); font-size: .95rem; font-variant-numeric: tabular-nums; letter-spacing: .04em; direction: ltr; }
  .clock.low { color: var(--urgent); }
  .bar { flex: 1; min-width: 0; height: 2px; background: var(--line); position: relative; overflow: hidden; direction: ltr; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--fg); transition: width 1s linear; }
  .bar.low i { background: var(--urgent); }

  main {
    box-sizing: border-box; min-height: 100%; max-width: 34rem; margin-inline: auto;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 64px 0 20px; text-align: center;
  }
  section { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  :lang(ar) .eyebrow { letter-spacing: 0; text-transform: none; }
  h1 { font-family: var(--display); font-weight: 300; font-size: clamp(1.45rem, 4.6vw, 1.9rem); line-height: 1.5; margin: 0; text-wrap: balance; }
  p { margin: 0; text-wrap: balance; }
  .muted { color: var(--muted); }
  .rule { width: 2.5rem; height: 1px; background: var(--line); }
  .warm { font-family: var(--display); font-weight: 500; font-size: 1.15rem; line-height: 1.8; }

  .help { font-size: .92rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .3rem .6rem; justify-content: center; align-items: baseline; }
  .help strong { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; user-select: all; letter-spacing: .04em; }

  .btn {
    cursor: pointer; font-weight: 400;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
    padding: .65rem 1.6rem; border-radius: 999px;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.link { border-color: transparent; background: transparent; color: var(--muted); padding-inline: .6rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }

  .in { animation: rise .9s ease-out both; animation-delay: calc(var(--i, 0) * .4s); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* breathing */
  .orb-wrap { width: min(13rem, 58vw); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
  .orb {
    width: 45%; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--accent);
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    animation: breathe 10s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(2); } }
  .cue { font-family: var(--display); font-size: 1.2rem; min-height: 2em; }
  .count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--mono); }

  /* questions */
  .qnum { font-family: var(--mono); font-size: .8rem; color: var(--muted); letter-spacing: .08em; direction: ltr; }
  textarea {
    width: 100%; min-height: 7rem; resize: vertical;
    font: inherit; font-weight: 300; line-height: 1.8; color: var(--fg);
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    padding: .4rem 0; text-align: start;
  }
  textarea:focus { outline: none; border-bottom-color: var(--accent); }
  textarea::placeholder { color: var(--muted); opacity: .7; }

  /* letter */
  .letter {
    width: 100%; text-align: start; display: flex; flex-direction: column; gap: 1.2rem;
    border-top: 1px solid var(--line); padding-top: 1.4rem;
  }
  .letter dt { font-size: .85rem; color: var(--muted); }
  .letter dd { margin: .2rem 0 0; font-family: var(--display); white-space: pre-wrap; overflow-wrap: anywhere; }
  .letter dd.empty { color: var(--muted); font-style: italic; font-family: var(--body); }
  .toast { font-size: .85rem; color: var(--muted); min-height: 1.4em; }

  @media (prefers-reduced-motion: reduce) {
    .in { animation: none; }
    .orb { animation: none; transform: scale(1.5); }
    .bar i { transition: none; }
  }
  @media (max-width: 420px) {
    .rail { padding-right: 175px; }
    .lang { max-width: 7.5rem; }
  }
</style>

  <!-- 2 breathe -->

  </section>

  <!-- 3 premise -->

    <h1 class="in" style="--i:1" data-i18n="pH1"></h1>
    <p class="in" style="--i:2" data-i18n="pP1"></p>
    <p class="in muted" style="--i:3" data-i18n="pP2"></p>
    <div class="actions in" style="--i:4"><button class="btn" id="startBtn" data-i18n="start"></button></div>
  </section>

  <!-- 4 questions -->
  <section id="ask" hidden>
    <span class="qnum" id="qnum">1 / 5</span>
    <h1 id="qtext"></h1>
    <label for="answer" class="muted" id="qhint" style="font-size:.92rem"></label>
    <textarea id="answer" data-i18n-ph="ph"></textarea>
    <div class="actions">
      <button class="btn link" id="prevBtn" data-i18n="prev"></button>
      <button class="btn" id="nextBtn"></button>
    </div>
  </section>

  <!-- 5 deadline -->
  <section id="deadline" hidden>
    <span class="eyebrow in" style="--i:0" data-i18n="dEyebrow"></span>
    <h1 class="in" style="--i:1" data-i18n="dH1"></h1>
    <p class="in" style="--i:2" data-i18n="dP"></p>
    <div class="actions in" style="--i:3"><button class="btn" id="toLetter" data-i18n="toLetter"></button></div>
  </section>

  <!-- 6 letter -->
  <section id="letterView" hidden>
    <span class="eyebrow" data-i18n="lEyebrow"></span>
    <h1 data-i18n="lH1"></h1>
    <dl class="letter" id="letter"></dl>
    <div class="rule"></div>
    <p class="warm" data-i18n="lWarm"></p>
    <div class="actions">
      <button class="btn" id="copyBtn" data-i18n="copy"></button>
      <button class="btn ghost" id="restartBtn" data-i18n="restart"></button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
    <div class="help">
      <span data-i18n="helpListen"></span>
      <span data-i18n="helpLine"></span>
      <span data-i18n="helpIntl"></span>
    </div>
  </section>

  <!-- rest -->
  <section id="bye" hidden>
    <span class="eyebrow" data-i18n="byeEyebrow"></span>
    <h1 data-i18n="byeH1"></h1>
    <p data-i18n="byeP"></p>
    <div class="help">
      <span data-i18n="helpListen"></span>
      <span data-i18n="helpLine"></span>
      <span data-i18n="helpIntl"></span>
    </div>
    <button class="btn ghost" id="backBtn" data-i18n="back"></button>
  </section>
</main>

  let lang = pickLang();
  const t = k => T[lang][k];

  let answers = load();
  let qi = 0, left = TOTAL, clockTimer = null, breathTimer = null, breathN = 60;

  function pickLang() {
    try { const s = localStorage.getItem(LANG_KEY); if (s && T[s]) return s; } catch (e) {}
    return "th";
  }
  function load() {
    try { const a = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(a)) return a; } catch (e) {}
    return Array(QN).fill("");
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

  function applyLang() {
    const d = document.documentElement;
    d.lang = lang;
    d.dir = RTL.includes(lang) ? "rtl" : "ltr";
    document.title = t("title");
    $("lang").value = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = t(el.dataset.i18n);
      el.innerHTML = v;
      el.hidden = !v;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    renderQ();
    if (!$("letterView").hidden) renderLetter();
    if (!$("breath").hidden) paintCue();
    $("toast").textContent = "";
    fit();
  }

  // Shrink the root font size until the current screen fits the viewport, so nothing needs scrolling.
  // The letter screen holds free-form user text, so it is left to scroll.
  function fit() {
    const r = document.documentElement;
    let px = 16;
    r.style.fontSize = px + "px";
    if (!$("letterView").hidden) return;
    while (px > 9 && r.scrollHeight > window.innerHeight + 1) {
      px -= 0.5;
      r.style.fontSize = px + "px";
    }
  }

  function show(name) {
    SECTIONS.forEach(s => { $(s).hidden = s !== name; });
    $("rail").hidden = name !== "ask";
    clearInterval(breathTimer);
    if (name === "breath") startBreath();
    if (name === "ask") setTimeout(() => $("answer").focus(), 50);
    window.scrollTo(0, 0);
    fit();
  }

  function paintCue() { $("cue").textContent = (60 - breathN) % 10 < 5 ? t("inhale") : t("exhale"); }
  function startBreath() {
    breathN = 60;
    $("count").textContent = breathN;
    paintCue();
    breathTimer = setInterval(() => {
      breathN -= 1;
      paintCue();
      $("count").textContent = breathN;
      if (breathN <= 0) show("premise");
    }, 1000);
  }

  function fmt(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function paintClock() {
    $("clock").textContent = fmt(left);
    $("barFill").style.width = (left / TOTAL * 100) + "%";
    const low = left <= 30;
    $("clock").classList.toggle("low", low);
    $("bar").classList.toggle("low", low);
  }
  function startClock() {
    stopClock();
    left = TOTAL; paintClock();
    clockTimer = setInterval(() => {
      left -= 1; paintClock();
      if (left <= 0) { stopClock(); commit(); show("deadline"); }
    }, 1000);
  }
  function stopClock() { clearInterval(clockTimer); clockTimer = null; }

  function renderQ() {
    const [q, h] = t("qs")[qi];
    $("qnum").textContent = (qi + 1) + " / " + QN;
    $("qtext").textContent = q;
    $("qhint").textContent = h;
    $("answer").value = answers[qi] || "";
    $("prevBtn").hidden = qi === 0;
    $("nextBtn").textContent = qi === QN - 1 ? t("finish") : t("next");
  }
  function commit() { answers[qi] = $("answer").value.trim(); save(); }

  function renderLetter() {
    const dl = $("letter"); dl.innerHTML = "";
    t("qs").forEach(([q], i) => {
      const wrap = document.createElement("div");
      const dt = document.createElement("dt"); dt.textContent = q;
      const dd = document.createElement("dd");
      if (answers[i]) dd.textContent = answers[i];
      else { dd.textContent = t("empty"); dd.className = "empty"; }
      wrap.append(dt, dd); dl.append(wrap);
    });
  }
  function letterText() {
    return t("letterTitle") + "\n\n" + t("qs").map(([q], i) => q + "\n" + (answers[i] || "-")).join("\n\n");
  }

  $("lang").onchange = () => {
    if (!$("ask").hidden) commit();
    lang = $("lang").value;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  };
  $("goBtn").onclick = () => show("breath");
  $("laterBtn").onclick = () => show("bye");
  $("skipBreath").onclick = () => show("premise");
  $("startBtn").onclick = () => { qi = 0; renderQ(); show("ask"); startClock(); };
  $("answer").addEventListener("input", () => { answers[qi] = $("answer").value; save(); });
  $("prevBtn").onclick = () => { commit(); qi = Math.max(0, qi - 1); renderQ(); $("answer").focus(); };
  $("nextBtn").onclick = () => {
    commit();
    if (qi < QN - 1) { qi += 1; renderQ(); $("answer").focus(); }
    else { stopClock(); show("deadline"); }
  };
  $("toLetter").onclick = () => { renderLetter(); show("letterView"); };
  $("copyBtn").onclick = () => {
    const done = () => { $("toast").textContent = t("copied"); };
    const fail = () => { $("toast").textContent = t("copyFail"); };
    try { navigator.clipboard.writeText(letterText()).then(done, fail); } catch (e) { fail(); }
  };
  $("restartBtn").onclick = () => {
    answers = Array(QN).fill(""); save(); $("toast").textContent = ""; show("notice");
  };
  $("closeBtn").onclick = () => { if (!$("ask").hidden) commit(); stopClock(); show("bye"); };
  $("backBtn").onclick = () => show("notice");

  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  applyLang();
